name: Check CV is up to date

on:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'public/cv.pdf'
      - 'scripts/build-cv.sh'
      - '.github/workflows/cv.yml'
  pull_request:
    paths:
      - 'cv/**'
      - 'public/cv.pdf'
      - 'scripts/build-cv.sh'
      - '.github/workflows/cv.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Render CV
        run: |
          cp public/cv.pdf /tmp/committed.pdf
          bash scripts/build-cv.sh

      # Neither PDF bytes nor line breaks are stable across machines (font
      # subsetting, font versions), so compare the words in the text layer.
      - name: Fail if public/cv.pdf is out of date
        run: |
          normalize() { pdftotext "$1" - | tr -d '[:space:]-' | fold -w 100; }
          normalize /tmp/committed.pdf > /tmp/committed.txt
          normalize public/cv.pdf > /tmp/rendered.txt
          if ! diff -u /tmp/committed.txt /tmp/rendered.txt; then
            echo "::error::public/cv.pdf does not match cv/cv.yaml. Run 'npm run cv' and commit the result."
            exit 1
          fi
