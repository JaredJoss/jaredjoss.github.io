design:
  theme: classic
  page:
    size: us-letter
    top_margin: 1.3cm
    bottom_margin: 1.3cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0,0,0)
    name: rgb(0,0,0)
    headline: rgb(0,0,0)
    connections: rgb(0,0,0)
    section_titles: rgb(0,0,0)
    links: rgb(40,72,130)
  typography:
    line_spacing: 0.55em
    alignment: left
    font_family:
      body: Lato
      name: Lato
      headline: Lato
      connections: Lato
      section_titles: Lato
    font_size:
      body: 9pt
      name: 20pt
      connections: 9pt
      section_titles: 1.05em
    bold:
      name: true
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.25cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: international
      show_icons: true
      separator: ""
      space_between_connections: 0.7cm
  section_titles:
    type: with_full_line
    line_thickness: 0.6pt
    space_above: 0.4cm
    space_below: 0.2cm
  sections:
    space_between_regular_entries: 0.35cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.6cm
    side_space: 0cm
    short_second_row: false
    summary:
      space_above: 0.08cm
    highlights:
      bullet: "•"
      space_left: 0.35cm
      space_above: 0.08cm
      space_between_items: 0.08cm
      space_between_bullet_and_text: 0.3em
  templates:
    education_entry:
      main_column: "**INSTITUTION**\n*DEGREE_WITH_AREA*\nSUMMARY\nHIGHLIGHTS"
      degree_column: null
      date_and_location_column: "DATE\n*LOCATION*"
    experience_entry:
      main_column: "**COMPANY**\n*POSITION*\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE\n*LOCATION*"
    normal_entry:
      main_column: "**NAME**\n*SUMMARY*\nLOCATION"
      date_and_location_column: "DATE"
    publication_entry:
